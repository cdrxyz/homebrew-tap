name: Update Cask

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without a leading v
        required: true
        type: string
      sha256:
        description: SHA256 of the arm64 zip
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: macos-latest
    steps:
      - name: Validate inputs
        env:
          VERSION: ${{ inputs.version }}
          SHA256: ${{ inputs.sha256 }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]]

      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Update cask
        env:
          VERSION: ${{ inputs.version }}
          SHA256: ${{ inputs.sha256 }}
        run: |
          perl -pi -e 's/^  version ".*"/  version "$ENV{VERSION}"/' Casks/q-for-email.rb
          perl -pi -e 's/^  sha256 ".*"/  sha256 "$ENV{SHA256}"/' Casks/q-for-email.rb

      - name: Check cask style
        run: brew style --cask Casks/q-for-email.rb

      - name: Open pull request
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "eizus"
          git config user.email "hello@cdr.xyz"
          git checkout -b "cask-q-for-email-$VERSION"
          git add Casks/q-for-email.rb
          if git diff --staged --quiet; then
            echo "Cask is already up to date."
            exit 0
          fi
          git commit -m "q-for-email $VERSION"
          git push --set-upstream origin "HEAD:cask-q-for-email-$VERSION"
          gh pr create --title "q-for-email $VERSION" --body "Update the Q for Email cask to $VERSION."
